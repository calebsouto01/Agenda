name: Build Android release AAB (Play Store)

# Gera um Android App Bundle (.aab) assinado com a chave de upload da Zaka,
# no formato que a Play Store exige. Só roda manualmente: cada envio à Play
# Store precisa de um versionCode maior que o anterior, então gerar isso em
# todo push não faria sentido.
#
# Requer os seguintes Secrets configurados no repositório (Settings > Secrets
# and variables > Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Código de versão (precisa ser maior que o último enviado à Play Store)"
        required: true
      version_name:
        description: "Nome de versão visível ao usuário (ex.: 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Decode signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.jks

      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew bundleRelease

      - name: Remove signing key
        if: always()
        run: rm -f ${{ github.workspace }}/release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: zaka-release-aab-v${{ inputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
