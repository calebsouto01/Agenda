name: Build Android debug APK

# Gera um .apk de depuração instalável direto no celular (sem passar pela
# Play Store), pra testar o app nativo enquanto a publicação não sai.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "www/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: agenda-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Publica numa Release fixa (mesma tag sempre) com link direto de
      # download — mais simples de achar e baixar pelo celular (inclusive
      # pelo app oficial do GitHub) do que a seção de Artifacts da run.
      - name: Publish debug APK as a release
        uses: ncipollo/release-action@v1
        with:
          tag: debug-latest
          name: Agenda (debug APK)
          body: Build de teste automática, gerada a partir do commit ${{ github.sha }}. Não é uma versão da Play Store.
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
